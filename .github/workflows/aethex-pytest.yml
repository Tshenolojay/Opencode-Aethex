name: aethex-pytest

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/orchestrator/**"
      - "packages/core/src/session.ts"
      - "packages/core/src/session/**"
      - "packages/core/src/system-context/orchestration.ts"
      - "packages/core/src/tool/task.ts"
      - "packages/core/src/plugin/agent.ts"
      - "packages/tui/src/**"
      - "tests/aethex/**"
      - ".github/workflows/aethex-pytest.yml"
  workflow_dispatch:

jobs:
  orchestrator-integration-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest==8.3.5

      - name: Verify Aethex orchestrator integration contracts
        run: python -m pytest tests/aethex/test_orchestrator_integration.py -q
